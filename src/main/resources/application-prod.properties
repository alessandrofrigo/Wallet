# Attivo solo in produzione (SPRING_PROFILES_ACTIVE=prod), mai in locale su http://localhost:
# il flag secure richiede HTTPS, altrimenti il browser scarta il cookie di sessione.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Swagger/OpenAPI non deve essere pubblicamente raggiungibile in produzione.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
